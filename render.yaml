services:
  - type: web
    name: smart-urban-planning-api
    runtime: python
    plan: free                # 512 MB RAM; the TFLite backend peaks at ~414 MB
    buildCommand: pip install -r requirements-backend.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: FRONTEND_ORIGINS
        sync: false           # set to your Vercel URL, e.g. https://your-app.vercel.app
